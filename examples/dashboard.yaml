# Example view. device_id is optional: without it the cards pick the first UAHPET device.
title: Litter box
path: litter-box
type: sections
sections:
  - type: grid
    cards:
      - type: custom:uahpet-litterbox-card
      - type: custom:uahpet-litterbox-maintenance-card
      - type: custom:uahpet-litterbox-mini-card
  - type: grid
    cards:
      - type: custom:uahpet-litterbox-timeline-card
      - type: custom:uahpet-litterbox-stats-card
  - type: grid
    cards:
      - type: custom:uahpet-litterbox-settings-card
  - type: grid
    cards:
      # One card per purifier. Pick each device in the card editor (device_id).
      - type: custom:uahpet-purifier-card
        title: Salón
      - type: custom:uahpet-purifier-card
        title: Cuarto
