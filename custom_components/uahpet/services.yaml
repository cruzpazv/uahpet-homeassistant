reassign_last_visit:
  fields:
    cat:
      required: true
      example: "Luna"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: uahpet

recalibrate_weight:
  fields:
    cat:
      required: true
      example: "Luna"
      selector:
        text:
    weight:
      required: false
      example: 4.2
      selector:
        number:
          min: 0.3
          max: 20
          step: 0.05
          unit_of_measurement: kg
          mode: box
    samples:
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 20
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: uahpet

clear_unidentified_visits:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: uahpet

add_cat:
  fields:
    name:
      required: true
      example: "Luna"
      selector:
        text:
    weight:
      required: true
      example: 4.2
      selector:
        number:
          min: 0.5
          max: 15
          step: 0.05
          unit_of_measurement: kg
          mode: box
    color:
      required: false
      example: "#e15759"
      selector:
        text:
    picture:
      required: false
      example: "/local/cats/luna.jpg"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: uahpet
